[project]
name = "snip"
version = "0.1.0"
description = "A small URL-shortener HTTP service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
